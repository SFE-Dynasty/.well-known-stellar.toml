name: Keep Render Alive
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Fiduciary Clearing Engine
        run: |
          curl -s https://fiduciary-clearing-engine.onrender.com/ > /dev/null && echo "Render service pinged successfully"
